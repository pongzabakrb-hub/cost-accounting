<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1E3A5F"/>
  <!-- T-account shape -->
  <rect x="96" y="120" width="320" height="8" rx="4" fill="#F0F4F8"/>
  <rect x="252" y="120" width="8" height="280" rx="4" fill="#F0F4F8"/>
  <!-- Dr -->
  <text x="174" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#6BAFE0">Dr</text>
  <!-- Cr -->
  <text x="338" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#E8707C">Cr</text>
  <!-- Numbers -->
  <text x="174" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" fill="#F0F4F8" opacity=".6">5,000</text>
  <text x="174" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" fill="#F0F4F8" opacity=".6">3,200</text>
  <text x="338" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" fill="#F0F4F8" opacity=".6">6,800</text>
  <!-- Total line -->
  <rect x="116" y="330" width="116" height="3" fill="#F0F4F8" opacity=".4"/>
  <text x="174" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#F0F4F8">8,200</text>
  <rect x="120" y="382" width="108" height="3" fill="#F0F4F8"/>
  <rect x="120" y="389" width="108" height="3" fill="#F0F4F8"/>
</svg>
