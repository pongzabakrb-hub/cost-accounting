<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ต้นทุนผลิต">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>บัญชีต้นทุนผลิต</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap">

<style>
/* ─── tokens ─── */
:root {
  --bg: #F4F1EC;
  --card: #FFFFFF;
  --card-b: #D4CFC7;
  --hdr: #1E3A5F;
  --hdr-t: #F0F4F8;
  --dr: #2E6B9E;
  --cr: #A83240;
  --in-bg: #FFFCF0;
  --au-bg: #ECF4EC;
  --au-b: #8CB88C;
  --txt: #2C2C2C;
  --txt2: #7A7A72;
  --lbl: #3A3A36;
  --line: #2C2C2C;
  --flash: #C8E6C8;
  --div: #E8E4DC;
  --neg: #A83240;
  --fab-sh: rgba(0,0,0,.22);
  --calc-num: #EDEAE4;
  --calc-fn: transparent;
  --nav-bg: #E8E4DC;
  --nav-act: #1E3A5F;
  --sub-act: #2E6B9E;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181B21;--card:#22262E;--card-b:#363B46;--hdr:#1B3354;--hdr-t:#D0D8E6;
  --dr:#6BAFE0;--cr:#E8707C;--in-bg:#2C291E;--au-bg:#1C2B1C;--au-b:#4A8A4A;
  --txt:#D4D4D4;--txt2:#828A9A;--lbl:#A8B0BC;--line:#6E7888;--flash:#284428;
  --div:#363B46;--neg:#E8707C;--fab-sh:rgba(0,0,0,.45);--calc-num:#2E323A;--calc-fn:transparent;
  --nav-bg:#2A2E36;--nav-act:#3A6BA8;--sub-act:#6BAFE0;
}}
:root[data-theme="dark"]{
  --bg:#181B21;--card:#22262E;--card-b:#363B46;--hdr:#1B3354;--hdr-t:#D0D8E6;
  --dr:#6BAFE0;--cr:#E8707C;--in-bg:#2C291E;--au-bg:#1C2B1C;--au-b:#4A8A4A;
  --txt:#D4D4D4;--txt2:#828A9A;--lbl:#A8B0BC;--line:#6E7888;--flash:#284428;
  --div:#363B46;--neg:#E8707C;--fab-sh:rgba(0,0,0,.45);--calc-num:#2E323A;--calc-fn:transparent;
  --nav-bg:#2A2E36;--nav-act:#3A6BA8;--sub-act:#6BAFE0;
}

/* ─── base ─── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent}

/* ─── app bar ─── */
.bar{position:sticky;top:0;z-index:50;background:var(--hdr);color:var(--hdr-t);
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.bar-btn{padding:5px 14px;border:1px solid rgba(255,255,255,.25);border-radius:4px;
  background:transparent;color:var(--hdr-t);font-family:inherit;font-size:12px;
  font-weight:600;cursor:pointer;transition:background .15s}
.bar-btn:hover{background:rgba(255,255,255,.1)}

/* ─── navigation ─── */
.nav{display:flex;gap:4px;padding:8px 16px 6px;justify-content:center;flex-wrap:wrap}
.nav-btn{padding:6px 18px;border:1px solid var(--card-b);border-radius:20px;
  background:var(--card);color:var(--txt);font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn:hover{background:var(--nav-bg)}
.nav-btn.active{background:var(--nav-act);color:#fff;border-color:var(--nav-act)}

.sub-nav{display:flex;gap:4px;padding:0 16px 8px;justify-content:center}
.sub-btn{padding:4px 14px;border:1px solid var(--card-b);border-radius:14px;
  background:transparent;color:var(--txt2);font-family:inherit;font-size:12px;
  font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.sub-btn:hover{border-color:var(--sub-act);color:var(--sub-act)}
.sub-btn.active{background:var(--sub-act);color:#fff;border-color:var(--sub-act)}

/* ─── content ─── */
main{padding:8px 16px 68px;max-width:980px;margin:0 auto}
.hint{text-align:center;font-size:12.5px;color:var(--txt2);margin:0 0 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;
  color:var(--txt2);margin-bottom:12px}
.leg{display:flex;align-items:center;gap:5px}
.sw{width:20px;height:14px;border-radius:3px;flex-shrink:0}

/* ─── grid ─── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:700px){.grid{grid-template-columns:1fr;gap:10px}}

/* ─── T-account card ─── */
.acct{background:var(--card);border:1px solid var(--card-b);border-radius:5px;overflow:hidden}
.acct-n{background:var(--hdr);color:var(--hdr-t);padding:6px 10px;font-size:13px;
  font-weight:600;text-align:center;letter-spacing:.02em;line-height:1.35}
.acct-n small{font-size:11px;font-weight:400;opacity:.85}
.acct-b{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:460px){
  .acct-b{grid-template-columns:1fr}
  .side.dr{border-right:none!important;border-bottom:2px solid var(--hdr)}
}
.side{padding:6px 8px 8px;display:flex;flex-direction:column;gap:3px}
.side.dr{border-right:2px solid var(--hdr)}
.sh{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.side.dr .sh{color:var(--dr)} .side.cr .sh{color:var(--cr)}

.row{display:flex;align-items:center;gap:4px;font-size:12px}
.row .lbl{flex:1;min-width:0;color:var(--lbl);line-height:1.3}
.row input{width:70px;flex-shrink:0;text-align:right;padding:3px 5px;
  border:1px solid var(--card-b);border-radius:3px;background:var(--in-bg);color:var(--txt);
  font-family:inherit;font-size:12.5px;font-variant-numeric:tabular-nums;outline:none;
  transition:border-color .15s,box-shadow .15s}
.row input:focus{border-color:var(--dr);box-shadow:0 0 0 2px rgba(46,107,158,.12)}
.row input[data-auto]{background:var(--au-bg);border-style:dashed;border-color:var(--au-b)}
.row input[data-auto].override{background:var(--in-bg);border-style:solid;border-color:var(--card-b)}
.row input.flash{animation:pop .7s ease-out}
@keyframes pop{0%,25%{background-color:var(--flash)}100%{background-color:var(--au-bg)}}

.spacer{height:5px}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;
  padding-top:3px;border-top:1px solid var(--line);font-weight:700;font-size:12.5px}
.tot .v{min-width:70px;text-align:right;padding:2px 5px 1px;border-bottom:3px double var(--line)}
.tot .v.neg{color:var(--neg)}

/* ─── FAB ─── */
.fab{position:fixed;bottom:18px;right:18px;width:50px;height:50px;border-radius:50%;
  background:var(--hdr);color:var(--hdr-t);border:none;font-size:22px;cursor:pointer;
  box-shadow:0 3px 14px var(--fab-sh);z-index:90;display:flex;align-items:center;
  justify-content:center;transition:transform .25s,opacity .2s}
.fab:hover{transform:scale(1.06)}
.fab:active{transform:scale(.95)}
.fab.gone{transform:scale(0) rotate(90deg);opacity:0;pointer-events:none}

/* ─── calculator panel ─── */
.calc{position:fixed;bottom:76px;right:14px;width:272px;background:var(--card);
  border:1px solid var(--card-b);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
  z-index:100;transform:scale(.92) translateY(16px);opacity:0;pointer-events:none;
  visibility:hidden;transition:transform .22s ease,opacity .22s ease,visibility 0s .22s}
.calc.open{transform:scale(1) translateY(0);opacity:1;pointer-events:auto;
  visibility:visible;transition:transform .22s ease,opacity .22s ease,visibility 0s 0s}
@media(max-width:460px){.calc{right:8px;left:8px;width:auto;bottom:72px}}

.calc-hd{background:var(--hdr);color:var(--hdr-t);padding:7px 12px;display:flex;
  align-items:center;justify-content:space-between;font-size:13px;font-weight:600;
  border-radius:12px 12px 0 0}
.calc-x{background:none;border:none;color:var(--hdr-t);font-size:18px;cursor:pointer;
  padding:0 4px;opacity:.7;transition:opacity .15s}
.calc-x:hover{opacity:1}

.calc-scr{padding:10px 12px 6px;text-align:right;border-bottom:1px solid var(--div);
  min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-expr{font-size:12px;color:var(--txt2);min-height:16px;line-height:1.3;word-break:break-all}
.calc-disp{font-size:28px;font-weight:700;color:var(--txt);line-height:1.15;
  overflow-x:auto;white-space:nowrap}

.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px 4px}
.ck{padding:12px 0;border:none;border-radius:6px;font-family:inherit;font-size:17px;
  font-weight:600;cursor:pointer;background:var(--calc-num);color:var(--txt);
  transition:background .1s,transform .08s;-webkit-user-select:none;user-select:none}
.ck:active{transform:scale(.94)}
.ck.op{background:var(--dr);color:#fff}
.ck.eq{background:var(--hdr);color:var(--hdr-t)}
.ck.fn{background:var(--calc-fn);color:var(--cr);font-weight:700}
.ck.wide{grid-column:span 2}

.calc-ins{display:block;width:calc(100% - 16px);margin:2px 8px 8px;padding:8px;
  border:1px dashed var(--au-b);border-radius:6px;background:var(--au-bg);color:var(--txt);
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:center;
  transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-ins:hover:not(:disabled){background:var(--flash)}
.calc-ins:disabled{opacity:.45;cursor:default}

/* ─── responsive tweaks ─── */
@media(max-width:460px){
  .row input,.tot .v{width:60px;min-width:60px;font-size:11.5px}
  .row .lbl{font-size:11px}
  .acct-n{font-size:12px}
  .bar h1{font-size:15px}
  .nav-btn{padding:5px 12px;font-size:12px}
}
</style>
</head>
<body>

<!-- APP BAR -->
<header class="bar">
  <h1>&#x1F9EE; บัญชีต้นทุนผลิต</h1>
  <button class="bar-btn" id="btnClear">ล้างทั้งหมด</button>
</header>

<!-- NAVIGATION -->
<nav class="nav" id="mainNav">
  <button class="nav-btn" data-nav="actual">ต้นทุนจริง</button>
  <button class="nav-btn" data-nav="normal">ต้นทุนปกติ</button>
</nav>
<div class="sub-nav" id="subNav" hidden>
  <button class="sub-btn" data-sub="normal">แผนกเดียว</button>
  <button class="sub-btn" data-sub="normal2">2 แผนก</button>
</div>

<!-- CONTENT -->
<main>
<p class="hint">กรอกตัวเลขที่โจทย์ให้ — ค่าจะไหลไปบัญชีที่เชื่อมอัตโนมัติ · กด &#x1F9EE; เพื่อเปิดเครื่องคิดเลข</p>
<div class="legend">
  <div class="leg"><div class="sw" style="background:var(--in-bg);border:1px solid var(--card-b)"></div>กรอกเอง</div>
  <div class="leg"><div class="sw" style="background:var(--au-bg);border:1px dashed var(--au-b)"></div>อัตโนมัติ</div>
</div>
<div class="grid" id="grid"></div>
</main>

<!-- FAB -->
<button class="fab" id="fab" aria-label="เครื่องคิดเลข">&#x1F9EE;</button>

<!-- CALCULATOR -->
<div class="calc" id="calc">
  <div class="calc-hd">
    <span>เครื่องคิดเลข</span>
    <button class="calc-x" id="calcX" aria-label="ปิด">&#10005;</button>
  </div>
  <div class="calc-scr">
    <div class="calc-expr" id="cExpr"></div>
    <div class="calc-disp" id="cDisp">0</div>
  </div>
  <div class="calc-keys">
    <button class="ck fn" data-k="C">C</button>
    <button class="ck fn" data-k="⌫">⌫</button>
    <button class="ck fn" data-k="%">%</button>
    <button class="ck op" data-k="÷">÷</button>

    <button class="ck" data-k="7">7</button>
    <button class="ck" data-k="8">8</button>
    <button class="ck" data-k="9">9</button>
    <button class="ck op" data-k="×">×</button>

    <button class="ck" data-k="4">4</button>
    <button class="ck" data-k="5">5</button>
    <button class="ck" data-k="6">6</button>
    <button class="ck op" data-k="−">−</button>

    <button class="ck" data-k="1">1</button>
    <button class="ck" data-k="2">2</button>
    <button class="ck" data-k="3">3</button>
    <button class="ck op" data-k="+">+</button>

    <button class="ck wide" data-k="0">0</button>
    <button class="ck" data-k=".">.</button>
    <button class="ck eq" data-k="=">=</button>
  </div>
  <button class="calc-ins" id="calcIns" disabled>ใส่ค่า (เลือกช่องก่อน)</button>
</div>

<script>
(function(){
'use strict';

/* ─── utilities ─── */
var overrides = {};
function parse(s){ return s ? (parseFloat(String(s).replace(/,/g,''))||0) : 0; }
function fmt(n){ return n ? n.toLocaleString('en-US',{maximumFractionDigits:2,minimumFractionDigits:0}) : ''; }
function fmtC(n){
  if(n===null||n===undefined||isNaN(n)) return '';
  return n.toLocaleString('en-US',{maximumFractionDigits:8});
}
function getVal(id){ var e=document.getElementById(id); return e?parse(e.value):0; }
function setAuto(id,val){
  if(overrides[id]) return;
  var e=document.getElementById(id);
  if(!e||document.activeElement===e) return;
  var s=val?fmt(val):'';
  if(e.value===s) return;
  e.value=s;
  if(s){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}
}
function setTot(id,val){
  var e=document.getElementById(id);
  if(!e) return;
  e.textContent=val?fmt(val):'—';
  e.classList.toggle('neg',val<0);
}

/* ─── page configurations ─── */
var PAGES = {

  /* ========== ระบบบัญชีต้นทุนจริง ========== */
  actual: {
    key: 'cost-actual',
    accounts: [
      { name:'คุมวัตถุ', id:'mat',
        dr:[{id:'mat_beg',lbl:'ยอดยกมา'},{id:'mat_purchase',lbl:'ซื้อ'}],
        cr:[{id:'mat_direct',lbl:'เบิกใช้วัตถุทางตรง'},{id:'mat_indirect',lbl:'เบิกใช้วัตถุทางอ้อม'},{id:'mat_end',lbl:'ยอดยกไป',auto:1}]
      },
      { name:'คุมงานระหว่างทำ', id:'wip',
        dr:[{id:'wip_beg',lbl:'ยอดยกมา'},{id:'wip_mat',lbl:'วัตถุทางตรง',auto:1},{id:'wip_labor',lbl:'ค่าแรงงานตรง',auto:1},{id:'wip_moh',lbl:'ค่าใช้จ่ายการผลิต',auto:1}],
        cr:[{id:'wip_finished',lbl:'ผลิตเสร็จ'},{id:'wip_end',lbl:'ยอดยกไป',auto:1}]
      },
      { name:'คุมค่าแรง', id:'labor',
        dr:[{id:'labor_total',lbl:'ค่าแรงทั้งสิ้น'}],
        cr:[{id:'labor_direct',lbl:'ค่าแรงงานทางตรง'},{id:'labor_indirect',lbl:'ค่าแรงงานทางอ้อม'}]
      },
      { name:'คุมสินค้าสำเร็จรูป', id:'fg',
        dr:[{id:'fg_beg',lbl:'ยอดยกมา'},{id:'fg_finished',lbl:'ผลิตเสร็จ',auto:1}],
        cr:[{id:'fg_cogs',lbl:'ต้นทุนขาย'},{id:'fg_end',lbl:'ยอดยกไป',auto:1}]
      },
      { name:'คุมค่าใช้จ่ายการผลิต', id:'moh',
        dr:[{id:'moh_mat',lbl:'วัตถุทางอ้อม',auto:1},{id:'moh_labor',lbl:'ค่าแรงงานทางอ้อม',auto:1},{id:'moh_other',lbl:'ค่าใช้จ่ายผลิตอื่นๆ'}],
        cr:[{id:'moh_transfer',lbl:'โอนไปคุมงานระหว่างทำ',auto:1}]
      },
      { name:'ต้นทุนขาย', id:'cogs',
        dr:[{id:'cogs_val',lbl:'ต้นทุนขาย',auto:1}],
        cr:[{id:'cogs_profit',lbl:'กำไรขาดทุน'}]
      }
    ],
    flows: {
      mat_direct:['wip_mat'], mat_indirect:['moh_mat'],
      labor_direct:['wip_labor'], labor_indirect:['moh_labor'],
      wip_finished:['fg_finished'], fg_cogs:['cogs_val']
    },
    balance: function(g){
      var mohT=g('moh_mat')+g('moh_labor')+g('moh_other');
      setAuto('moh_transfer',mohT);
      setAuto('wip_moh',g('moh_transfer'));
      setAuto('mat_end',g('mat_beg')+g('mat_purchase')-g('mat_direct')-g('mat_indirect'));
      setAuto('wip_end',g('wip_beg')+g('wip_mat')+g('wip_labor')+g('wip_moh')-g('wip_finished'));
      setAuto('fg_end',g('fg_beg')+g('fg_finished')-g('fg_cogs'));
    }
  },

  /* ========== ระบบต้นทุนปกติ (แผนกเดียว) ========== */
  normal: {
    key: 'cost-hw',
    accounts: [
      { name:'คุมวัตถุ', id:'mat',
        dr:[{id:'mat_beg',lbl:'ยอดยกมา'},{id:'mat_purchase',lbl:'ซื้อวัตถุ'}],
        cr:[{id:'mat_direct',lbl:'เบิกใช้วัตถุทางตรง'},{id:'mat_indirect',lbl:'เบิกใช้วัตถุทางอ้อม'},{id:'mat_end',lbl:'ยอดยกไป',auto:1}]
      },
      { name:'คุมงานระหว่างทำ', id:'wip',
        dr:[{id:'wip_beg',lbl:'ยอดยกมา'},{id:'wip_mat',lbl:'วัตถุทางตรง',auto:1},{id:'wip_labor',lbl:'ค่าแรงงานทางตรง',auto:1},{id:'wip_applied',lbl:'ค่าใช้จ่ายผลิตคิดเข้างาน',auto:1}],
        cr:[{id:'wip_finished',lbl:'ผลิตเสร็จ'},{id:'wip_end',lbl:'ยอดยกไป',auto:1}]
      },
      { name:'คุมค่าแรงงาน', id:'labor',
        dr:[{id:'labor_total',lbl:'ค่าแรงงาน'}],
        cr:[{id:'labor_direct',lbl:'ค่าแรงงานทางตรง'},{id:'labor_indirect',lbl:'ค่าแรงงานทางอ้อม'}]
      },
      { name:'คุมสินค้าสำเร็จรูป', id:'fg',
        dr:[{id:'fg_beg',lbl:'ยอดยกมา'},{id:'fg_finished',lbl:'ผลิตเสร็จ',auto:1}],
        cr:[{id:'fg_cogs',lbl:'ต้นทุนขาย'},{id:'fg_end',lbl:'ยอดยกไป',auto:1}]
      },
      { name:'ค่าใช้จ่ายการผลิตคิดเข้างาน', id:'applied',
        dr:[{id:'applied_transfer',lbl:'โอนไปคุมค่าใช้จ่ายผลิต',auto:1}],
        cr:[{id:'applied_val',lbl:'ค่าใช้จ่ายผลิตคิดเข้างาน'}]
      },
      { name:'ต้นทุนขาย', id:'cogs',
        dr:[{id:'cogs_val',lbl:'ต้นทุนขาย',auto:1}],
        cr:[]
      },
      { name:'คุมค่าใช้จ่ายการผลิต', id:'moh',
        dr:[{id:'moh_mat',lbl:'วัตถุทางอ้อม',auto:1},{id:'moh_labor',lbl:'ค่าแรงงานทางอ้อม',auto:1},{id:'moh_other',lbl:'ค่าใช้จ่ายการผลิตอื่น'},{id:'moh_over',lbl:'คิดเข้างานสูงไป',auto:1}],
        cr:[{id:'moh_applied',lbl:'ค่าใช้จ่ายผลิตคิดเข้างาน',auto:1},{id:'moh_under',lbl:'คิดเข้างานต่ำไป',auto:1}]
      },

/* ─── state ─── */
var currentPage = null;
var inputs = [];
var lastInput = null, lastLabel = '';

/* ─── rendering ─── */
function buildSide(type, rows, acctId){
  var isdr = (type==='dr');
  var h='<div class="side '+type+'"><div class="sh">'+(isdr?'เดบิต':'เครดิต')+'</div>';
  for(var i=0;i<rows.length;i++){
    h+='<div class="row"><span class="lbl">'+rows[i].lbl+'</span>';
    h+='<input id="'+rows[i].id+'" inputmode="decimal"';
    if(rows[i].auto) h+=' data-auto';
    h+='></div>';
  }
  if(!rows.length) h+='<div class="spacer"></div>';
  var vis=rows.length?'':' style="visibility:hidden"';
  h+='<div class="tot"'+vis+'><span>รวม</span><span class="v" id="'+acctId+'_'+(isdr?'d':'c')+'t">—</span></div>';
  h+='</div>';
  return h;
}

function renderPage(pageId){
  var page=PAGES[pageId];
  if(!page) return;
  var grid=document.getElementById('grid');
  var h='';
  for(var i=0;i<page.accounts.length;i++){
    var a=page.accounts[i];
    h+='<div class="acct"><div class="acct-n">'+a.name+'</div><div class="acct-b">';
    h+=buildSide('dr',a.dr,a.id);
    h+=buildSide('cr',a.cr,a.id);
    h+='</div></div>';
  }
  grid.innerHTML=h;
  inputs=grid.querySelectorAll('input');
  for(var k=0;k<inputs.length;k++) wireInput(inputs[k]);
}

/* ─── input wiring ─── */
function wireInput(el){
  var isAuto=el.hasAttribute('data-auto');
  el.addEventListener('focus',function(){
    var v=parse(el.value);
    el.value=v?String(v):'';
    el.select();
    lastInput=el;
    var row=el.closest('.row'),lb=row?row.querySelector('.lbl'):null;
    lastLabel=lb?lb.textContent.trim():el.id;
    updateInsBtn();
  });
  el.addEventListener('input',function(){
    if(isAuto&&el.value.trim()!==''){overrides[el.id]=1;el.classList.add('override');}
    recalculate();
  });
  el.addEventListener('blur',function(){
    var v=parse(el.value);
    if(el.value.trim()===''||(!v&&v!==0)){
      if(isAuto){delete overrides[el.id];el.classList.remove('override');}
      el.value='';recalculate();
    } else { el.value=v?fmt(v):''; }
  });
}

/* ─── recalculate ─── */
function recalculate(){
  var page=PAGES[currentPage];
  if(!page) return;
  var src,i;
  for(src in page.flows){
    var val=getVal(src);
    for(i=0;i<page.flows[src].length;i++) setAuto(page.flows[src][i],val);
  }
  if(page.balance) page.balance(getVal);
  for(i=0;i<page.accounts.length;i++){
    var a=page.accounts[i],dt=0,ct=0,j;
    for(j=0;j<a.dr.length;j++) dt+=getVal(a.dr[j].id);
    for(j=0;j<a.cr.length;j++) ct+=getVal(a.cr[j].id);
    setTot(a.id+'_dt',dt);
    if(a.cr.length) setTot(a.id+'_ct',ct);
  }
  saveState();
}

/* ─── save / load ─── */
function saveState(){
  var page=PAGES[currentPage];
  if(!page) return;
  try{
    var d={},el;
    for(var i=0;i<inputs.length;i++){el=inputs[i];if(el.value.trim())d[el.id]=el.value;}
    d._ov=Object.keys(overrides);
    localStorage.setItem(page.key,JSON.stringify(d));
  }catch(e){}
}
function loadState(){
  var page=PAGES[currentPage];
  if(!page) return;
  try{
    var raw=localStorage.getItem(page.key);if(!raw)return;
    var d=JSON.parse(raw);if(!d)return;
    if(d._ov){for(var i=0;i<d._ov.length;i++)overrides[d._ov[i]]=1;}
    var id,el;
    for(id in d){
      if(id==='_ov')continue;
      el=document.getElementById(id);
      if(el){el.value=d[id];if(overrides[id])el.classList.add('override');}
    }
  }catch(e){}
}

/* ─── clear ─── */
document.getElementById('btnClear').addEventListener('click',function(){
  var page=PAGES[currentPage];
  overrides={};
  for(var i=0;i<inputs.length;i++){inputs[i].value='';inputs[i].classList.remove('override','flash');}
  if(page){
    for(var j=0;j<page.accounts.length;j++){
      var a=page.accounts[j];
      setTot(a.id+'_dt',0);
      if(a.cr.length) setTot(a.id+'_ct',0);
    }
    try{localStorage.removeItem(page.key);}catch(e){}
  }
});

/* ─── navigation ─── */
var navBtns=document.querySelectorAll('.nav-btn');
var subBtns=document.querySelectorAll('.sub-btn');
var subNav=document.getElementById('subNav');

function getNavState(){
  try{
    var s=localStorage.getItem('cost-nav');
    return s?JSON.parse(s):{nav:'normal',sub:'normal'};
  }catch(e){return {nav:'normal',sub:'normal'};}
}
function saveNavState(st){
  try{localStorage.setItem('cost-nav',JSON.stringify(st));}catch(e){}
}

function switchTo(pageId){
  if(currentPage===pageId) return;
  if(currentPage) saveState();
  currentPage=pageId;
  overrides={};
  lastInput=null;lastLabel='';
  updateInsBtn();
  if(calcOpen) toggleCalc();
  renderPage(pageId);
  loadState();
  recalculate();
}

function updateNav(st){
  for(var i=0;i<navBtns.length;i++){
    navBtns[i].classList.toggle('active',navBtns[i].dataset.nav===st.nav);
  }
  if(st.nav==='normal'){
    subNav.hidden=false;
    for(var j=0;j<subBtns.length;j++){
      subBtns[j].classList.toggle('active',subBtns[j].dataset.sub===st.sub);
    }
    switchTo(st.sub);
  } else {
    subNav.hidden=true;
    switchTo(st.nav);
  }
  saveNavState(st);
}

for(var ni=0;ni<navBtns.length;ni++){
  (function(btn){
    btn.addEventListener('click',function(){
      var st=getNavState();
      st.nav=btn.dataset.nav;
      if(st.nav==='normal'&&!st.sub) st.sub='normal';
      updateNav(st);
    });
  })(navBtns[ni]);
}
for(var si=0;si<subBtns.length;si++){
  (function(btn){
    btn.addEventListener('click',function(){
      var st=getNavState();
      st.sub=btn.dataset.sub;
      updateNav(st);
    });
  })(subBtns[si]);
}

/* ─── calculator ─── */
var C={
  val:'0', expr:'', prev:null, op:null, fresh:true,
  digit:function(d){
    if(this.fresh){this.val=d;this.fresh=false;}
    else{this.val=this.val==='0'?d:this.val+d;}
  },
  dot:function(){
    if(this.fresh){this.val='0.';this.fresh=false;}
    else if(!this.val.includes('.')){this.val+='.';}
  },
  oper:function(o){
    if(this.prev!==null&&this.op&&!this.fresh) this.exec();
    this.prev=parseFloat(this.val);
    this.expr=fmtC(this.prev)+' '+o;
    this.op=o; this.fresh=true;
  },
  exec:function(){
    if(this.prev===null||!this.op) return;
    var a=this.prev,b=parseFloat(this.val),r;
    switch(this.op){
      case'+':r=a+b;break;case'−':r=a-b;break;
      case'×':r=a*b;break;case'÷':r=b?a/b:NaN;break;
      default:r=b;
    }
    r=Math.round(r*1e10)/1e10;
    this.val=String(r); this.prev=r;
  },
  equals:function(){
    if(this.prev===null||!this.op) return;
    var a=this.prev, b=parseFloat(this.val), sym=this.op;
    this.exec();
    this.expr=fmtC(a)+' '+sym+' '+fmtC(b)+' =';
    this.op=null; this.prev=null; this.fresh=true;
  },
  clear:function(){this.val='0';this.expr='';this.prev=null;this.op=null;this.fresh=true;},
  back:function(){
    if(this.fresh) return;
    this.val=this.val.length>1?this.val.slice(0,-1):'0';
  },
  pct:function(){this.val=String(parseFloat(this.val)/100);this.fresh=true;},
  getDisplay:function(){
    var n=parseFloat(this.val);
    if(isNaN(n)) return 'Error';
    if(!this.fresh) return this.val;
    return fmtC(n);
  },
  getNum:function(){ return parseFloat(this.val)||0; }
};

function renderCalc(){
  document.getElementById('cExpr').textContent=C.expr;
  document.getElementById('cDisp').textContent=C.getDisplay();
}

var cks=document.querySelectorAll('.ck');
for(var ci=0;ci<cks.length;ci++){
  (function(btn){
    btn.addEventListener('click',function(){
      var k=btn.dataset.k;
      if(k>='0'&&k<='9') C.digit(k);
      else if(k==='.') C.dot();
      else if(k==='+'||k==='−'||k==='×'||k==='÷') C.oper(k);
      else if(k==='=') C.equals();
      else if(k==='C') C.clear();
      else if(k==='⌫') C.back();
      else if(k==='%') C.pct();
      renderCalc();
    });
  })(cks[ci]);
}

var calcEl=document.getElementById('calc');
var fabEl=document.getElementById('fab');
var calcOpen=false;

function toggleCalc(){
  calcOpen=!calcOpen;
  calcEl.classList.toggle('open',calcOpen);
  fabEl.classList.toggle('gone',calcOpen);
}
fabEl.addEventListener('click',toggleCalc);
document.getElementById('calcX').addEventListener('click',toggleCalc);

var insBtn=document.getElementById('calcIns');
function updateInsBtn(){
  if(lastLabel){
    insBtn.textContent='ใส่ค่า → '+lastLabel;
    insBtn.disabled=false;
  } else {
    insBtn.textContent='ใส่ค่า (เลือกช่องก่อน)';
    insBtn.disabled=true;
  }
}
insBtn.addEventListener('click',function(){
  if(!lastInput) return;
  var n=C.getNum();
  lastInput.value = n===0?'0':fmt(n);
  if(lastInput.hasAttribute('data-auto')){overrides[lastInput.id]=1;lastInput.classList.add('override');}
  recalculate();
  toggleCalc();
  lastInput.focus();
});

document.addEventListener('keydown',function(e){
  if(!calcOpen) return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT') return;
  var k=e.key,handled=true;
  if(k>='0'&&k<='9') C.digit(k);
  else if(k==='.') C.dot();
  else if(k==='+') C.oper('+');
  else if(k==='-') C.oper('−');
  else if(k==='*') C.oper('×');
  else if(k==='/') C.oper('÷');
  else if(k==='Enter'||k==='=') C.equals();
  else if(k==='Escape') toggleCalc();
  else if(k==='Backspace') C.back();
  else if(k==='Delete') C.clear();
  else if(k==='%') C.pct();
  else handled=false;
  if(handled){e.preventDefault();renderCalc();}
});

/* ─── init ─── */
updateNav(getNavState());

})();
